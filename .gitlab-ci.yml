image: debian:bookworm-slim
stages: [test]
native:
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends g++ cmake make libgtest-dev python3
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j2
    - ctest --test-dir build --output-on-failure
    - python3 app/server.py > server.log 2>&1 &
    - python3 -c "import time,urllib.request; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8080/health')"
    - python3 tests/test_web.py -v
  artifacts:
    when: always
    paths: [server.log]
