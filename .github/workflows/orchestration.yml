name: Verify provider coordination tooling
on:
  push:
    paths: ['tools/coordinate.py','tools/check_baseline.py','tools/validate_coordination.py','tests/orchestration/**','coordination/**','.github/workflows/orchestration.yml']
  pull_request:
    paths: ['tools/coordinate.py','tools/check_baseline.py','tools/validate_coordination.py','tests/orchestration/**','coordination/**','.github/workflows/orchestration.yml']
jobs:
  coordinator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the coordination contract
        run: python3 tools/validate_coordination.py
      - name: Exercise isolated Git attempts and fake-provider failover
        run: python3 -m unittest discover -s tests/orchestration -v
